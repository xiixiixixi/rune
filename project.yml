name: BetterShot
options:
  bundleIdPrefix: com.bettershot
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    # M2 §6 Universal 2：项目级强制双架构 + 关闭"仅活跃架构"，
    # 否则 Xcode 默认 Debug 只构当前架构（arm64）。
    ARCHS: ["arm64", "x86_64"]
    ONLY_ACTIVE_ARCH: NO

packages:
  CaptureKit:
    path: CaptureKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  BetterShot:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Backgrounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: CaptureKit
        product: CaptureKit
      - package: CaptureKit
        product: CaptureKitSCK
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bettershot.app
        PRODUCT_NAME: BetterShot
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/BetterShot.entitlements
        MARKETING_VERSION: "0.3.7"
        CURRENT_PROJECT_VERSION: "10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        # M2 §6 Universal 2：单包双架构。本机 arm64 可编译；x86_64 产物待 Intel 机器验证。
        ARCHS: ["arm64", "x86_64"]
        ONLY_ACTIVE_ARCH: NO
    entitlements:
      path: Resources/BetterShot.entitlements
